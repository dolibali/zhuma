apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhuma-backend
  labels:
    app.kubernetes.io/name: zhuma-backend
    app.kubernetes.io/part-of: zhuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zhuma-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zhuma-backend
        app.kubernetes.io/part-of: zhuma
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: zhuma-backend:unconfigured
          imagePullPolicy: IfNotPresent
          command: [node, /app/start.mjs]
          args:
            - --data
            - /data
            - --host
            - $(POD_IP)
            - --port
            - '3080'
            - --file-uploads
            - --independent-reviews
            - --public-origin
            - $(PUBLIC_ORIGIN)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PUBLIC_ORIGIN
              value: http://backend.invalid
          ports:
            - name: member
              containerPort: 3080
          startupProbe:
            httpGet:
              path: /workbench
              port: member
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /workbench
              port: member
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zhuma-backend-data
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
