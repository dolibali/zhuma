# Applied after the official Web composition, inside the disposable build tree.
# Keep conversation, model settings, tools, and security approval available for execution work.
- id: ui-schedule
  disabled: true
- id: ui-plugin-manager
  disabled: true
# RC.4's plugin browse/create menu requires the intentionally hidden manager.
- id: entry-customization
  disabled: true
- id: ui-settings-account
  disabled: true
- id: session-log-deepseek
  config:
    # Product default: do not contribute session logs to model requests.
    # Keep the official volatile setting available for an explicit user choice.
    enabled: false
- id: ui-settings-models
  config:
    # Manual work stays available before a model is configured. The Models
    # settings page and explicit credential setup remain available.
    credentialOnboarding: false
- insert:
    - id: zhuma-codearts-policy
      name: './lib/zhuma-workbench/codearts-policy.js'
      config: {}
    - id: dsh-acp-adapter
      name: '@zaimokuza/dsh-acp-adapter'
      # Loader merges this with the original SDK/plugin inject requirements.
      # A persisted profile must never precede the verified producer on reopen.
      inject: ['acpNativeToolHandoffPolicy']
      config: {}
    - id: zhuma-workbench
      name: './lib/zhuma-workbench/index.js'
      config:
        deploymentMode: legacy-single-user
