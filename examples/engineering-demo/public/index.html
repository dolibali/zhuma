<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>订单导入预览</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">运营工具 / 订单</p>
        <h1>订单导入预览</h1>
        <p>检查 CSV 中的订单，确认后下载预览报告。</p>
      </header>
      <form id="import-form">
        <label for="file">选择订单 CSV</label>
        <input id="file" type="file" accept=".csv,text/csv" required />
        <p class="hint">表头：order_id,customer,quantity,unit_price · UTF-8 · 最大 64 KB</p>
        <button id="preview" type="submit">预览订单</button>
      </form>
      <p id="status" role="status" aria-live="polite">尚未选择文件</p>
      <section id="result" hidden>
        <div class="result-header">
          <h2>预览结果</h2>
          <button id="download" type="button">下载报告</button>
        </div>
        <p id="summary"></p>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>订单号</th>
                <th>客户</th>
                <th>数量</th>
                <th>单价</th>
                <th>金额</th>
              </tr>
            </thead>
            <tbody id="orders"></tbody>
          </table>
        </div>
        <section id="error-section" hidden>
          <h2>需要修正</h2>
          <ul id="errors"></ul>
        </section>
      </section>
      <footer>仅预览和下载报告，不写入订单数据库。</footer>
    </main>
  </body>
</html>
