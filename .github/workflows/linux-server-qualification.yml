name: Linux server qualification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main source SHA to qualify
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/linux-server-qualification.yml
      - distribution/server/**
      - scripts/server/**
      - scripts/workbench/**
      - packages/**
      - patches/**
      - runtime.lock.json
      - pnpm-lock.yaml
      - package.json
      - .gitmodules
      - upstream/deepseek-harness
      - scripts/desktop/prepare.mjs
      - scripts/desktop/source-recipe.mjs
      - scripts/desktop/icon-assets.mjs
      - branding/default/**

permissions:
  contents: read

# Source-controlled mode: native diagnostics never authorize production artifacts.
env:
  LINUX_SERVER_MODE: qualify

concurrency:
  group: linux-server-${{ github.event.pull_request.number || inputs.source_sha }}
  cancel-in-progress: true

jobs:
  mode:
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      source: ${{ steps.select.outputs.source }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      EVENT_SHA: ${{ github.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      REQUESTED_SHA: ${{ inputs.source_sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: select
        run: |
          selected="$LINUX_SERVER_MODE"
          source="$PR_HEAD_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$EVENT_REF" = refs/heads/main || exit 1
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test "$REQUESTED_SHA" = "$EVENT_SHA" || exit 1
            test "$REQUESTED_SHA" = "$WORKFLOW_SHA" || exit 1
            test "$(git ls-remote --exit-code https://github.com/dolibali/zhuma.git refs/heads/main | cut -f1)" = "$REQUESTED_SHA" || exit 1
            selected=qualify
            source="$REQUESTED_SHA"
          else
            test "$EVENT_NAME" = pull_request || exit 1
          fi
          case "$selected" in native-probe|qualify) ;; *) exit 1 ;; esac
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
  native-probe:
    needs: mode
    if: needs.mode.outputs.selected == 'native-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ needs.mode.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.mode.outputs.source }}
          persist-credentials: false
      - name: Prepare a pure native probe with exact SDK package integrity
        run: |
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p .build/native-probe/results
          cat > .build/native-probe/fetch.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          // Exact entries from SDK 504a01a9578abc2c6f1fb896b1dc322c9fe24f66/pnpm-lock.yaml.
          const packages = {
            'node-addon-native-custom-loader': 'sha512-Zh87aubSc1UF8CzZsRws1KtSwXiPDH0tbcg8V/2OA8Tcq9yGJRESFcEOC5NGLFama5IGfC3aJhubZbrj9Un2qA==',
            'node-addon-require-builtin': 'sha512-BCxXCMZDs/VLLh64SwKNw/me7Qx1I7Be4qxWwYVRRm8tJoOB8fL7qg6CmXhSXeUqsKt72t8RaKCX4EN+5nocVg==',
            'node-addon-require-builtin-linux-x64-gnu': 'sha512-fh3K3/JvBfSYwU8vEOpp4Wdp4N/jX0EnZYq5GsaftlQin1FVqgve/yDNoh+asxBMOQyHOG8F4dXlV1WCierrfg==',
          };
          for (const [name, integrity] of Object.entries(packages)) {
            const response = await fetch(`https://registry.npmjs.org/${name}/-/${name}-0.1.9.tgz`);
            assert(response.ok, `Package download failed: ${name}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            assert.equal(`sha512-${createHash('sha512').update(bytes).digest('base64')}`, integrity);
            await writeFile(`${name}.tgz`, bytes);
          }
          await writeFile('packages.json', JSON.stringify(packages));
          JS
          cat > .build/native-probe/probe.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, realpathSync, statSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { join, relative } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const require = createRequire(import.meta.url);
          function encode(value, parents = new Set()) {
            if (value === null || typeof value !== 'object') return typeof value === 'bigint' ? String(value) : value;
            if (parents.has(value)) return '[circular]';
            parents.add(value);
            const result = Array.isArray(value) ? [] : {};
            if (value instanceof Error) result.name = value.name;
            for (const key of Object.getOwnPropertyNames(value)) {
              if (key !== 'length') result[key] = encode(value[key], parents);
            }
            parents.delete(value);
            return result;
          }
          const result = {
            scope: 'unqualified native diagnostics; no SDK build, CLI, profile or product acceptance',
            source: process.env.SOURCE_SHA,
            sdk: '504a01a9578abc2c6f1fb896b1dc322c9fe24f66',
            node: process.version, platform: process.platform, arch: process.arch, uid: process.getuid(),
            cacheDisabled: process.env.NARB_DISABLE_NATIVE_CACHE === '1',
            glibc: process.report.getReport().header.glibcVersionRuntime,
            tmpMount: readFileSync('/proc/self/mountinfo', 'utf8').split('\n').filter(line => line.split(' ')[4] === '/tmp'),
            packages: [],
          };
          assert.equal(process.version, 'v24.15.0');
          assert.equal(process.arch, 'x64');
          assert.equal(process.getuid(), 10001);
          for (const [name, integrity] of Object.entries(JSON.parse(readFileSync('/probe/packages.json', 'utf8')))) {
            const root = realpathSync(join('/probe/node_modules', name));
            const manifest = JSON.parse(readFileSync(join(root, 'package.json'), 'utf8'));
            assert.equal(manifest.name, name);
            assert.equal(manifest.version, '0.1.9');
            const files = [];
            function walk(directory) {
              for (const entry of readdirSync(directory, { withFileTypes: true })) {
                const path = join(directory, entry.name);
                if (entry.isDirectory()) walk(path);
                else {
                  const file = { path: relative(root, path), realpath: realpathSync(path), size: statSync(path).size, sha256: createHash('sha256').update(readFileSync(path)).digest('hex') };
                  if (entry.name.endsWith('.node')) {
                    const ldd = spawnSync('ldd', [path], { encoding: 'utf8' });
                    file.ldd = { status: ldd.status, stdout: ldd.stdout, stderr: ldd.stderr };
                  }
                  files.push(file);
                }
              }
            }
            walk(root);
            result.packages.push({ name, version: manifest.version, integrity, root, files });
          }
          try {
            const api = require('node-addon-require-builtin');
            result.bindingInfo = api.getBindingInfo();
            const requireBuiltin = typeof api === 'function' ? api : api.requireBuiltin;
            assert.equal(typeof requireBuiltin, 'function');
            const loader = requireBuiltin('internal/modules/esm/loader');
            assert(loader && typeof loader === 'object');
            result.native = { ok: true, builtinType: typeof loader };
          } catch (error) {
            result.native = { ok: false, error: encode(error) };
          }
          console.log(JSON.stringify(result));
          JS
          cat > .build/native-probe/Dockerfile <<'DOCKER'
          FROM node:24.15.0-bookworm-slim@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libstdc++6 && rm -rf /var/lib/apt/lists/* && groupadd --gid 10001 zhuma && useradd --uid 10001 --gid 10001 --no-create-home zhuma
          WORKDIR /probe
          COPY fetch.mjs probe.mjs ./
          RUN node fetch.mjs && for name in node-addon-native-custom-loader node-addon-require-builtin node-addon-require-builtin-linux-x64-gnu; do mkdir -p node_modules/$name; tar -xzf $name.tgz --strip-components=1 -C node_modules/$name; done
          USER 10001:10001
          ENTRYPOINT ["node", "--expose-internals", "/probe/probe.mjs"]
          DOCKER
          docker build --platform linux/amd64 -t zhuma-unqualified-native .build/native-probe
      - name: Compare the production tmpfs and official native-cache modes
        run: |
          docker volume create zhuma-native-tmp
          docker run --rm --name zhuma-native-default --network none --read-only --cpus 1 --memory 1g --tmpfs /tmp:rw,nosuid,nodev,size=128m -e SOURCE_SHA zhuma-unqualified-native > .build/native-probe/results/tmpfs-default.json
          docker run --rm --name zhuma-native-direct --network none --read-only --cpus 1 --memory 1g --tmpfs /tmp:rw,nosuid,nodev,size=128m -e SOURCE_SHA -e NARB_DISABLE_NATIVE_CACHE=1 zhuma-unqualified-native > .build/native-probe/results/tmpfs-direct.json
          docker run --rm --name zhuma-native-volume --network none --read-only --cpus 1 --memory 1g --mount type=volume,source=zhuma-native-tmp,target=/tmp -e SOURCE_SHA zhuma-unqualified-native > .build/native-probe/results/volume-default.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; for(const name of ["tmpfs-default","tmpfs-direct","volume-default"]){const r=JSON.parse(readFileSync(`.build/native-probe/results/${name}.json`)); console.log(JSON.stringify({name,scope:r.scope,native:r.native,tmpMount:r.tmpMount}));}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unqualified-native-diagnostics-${{ needs.mode.outputs.source }}
          path: .build/native-probe/results/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Dispose only native diagnostic resources
        if: always()
        run: |
          docker rm -f zhuma-native-default zhuma-native-direct zhuma-native-volume 2>/dev/null || true
          docker volume rm zhuma-native-tmp 2>/dev/null || true
  qualify:
    needs: mode
    if: needs.mode.outputs.selected == 'qualify'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.mode.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.mode.outputs.source }}
          persist-credentials: false
      - name: Bind the definition and product candidate to the exact source
        run: |
          test "$(uname -m)" = x86_64
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          docker build --platform linux/amd64 -f distribution/server/container/Dockerfile.builder -t zhuma-builder distribution/server/container
          docker volume create zhuma-source
      - name: Build the original SDK and the production payload without host credentials
        run: |
          docker run -i --name zhuma-build --mount type=volume,source=zhuma-source,target=/workspace zhuma-builder sh -s -- "$SOURCE_SHA" <<'BUILD'
          set -eu
          git clone --no-checkout https://github.com/dolibali/zhuma.git /workspace/source
          cd /workspace/source
          git fetch --depth=1 origin "$1"
          git checkout --detach "$1"
          git submodule update --init --depth=1 upstream/deepseek-harness
          node scripts/server/prepare.mjs
          cd .build/server/deepseek-harness
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build:native-system
          corepack pnpm run build:lib
          corepack pnpm run build:web
          cd /workspace/source
          corepack pnpm install --frozen-lockfile --ignore-scripts
          node scripts/server/package-runtime.mjs --sdk .build/server/deepseek-harness --out .build/backend-runtime
          BUILD
          mkdir -p .build/qualification/payload .build/qualification/artifacts
          docker cp zhuma-build:/workspace/source/.build/backend-runtime/. .build/qualification/payload/
      - name: Verify the immutable payload and build a non-root image
        run: |
          docker run --rm --mount "type=bind,source=$PWD/.build/qualification/payload,target=/payload,readonly" -e SOURCE_SHA zhuma-builder node --input-type=module -e '
          import assert from "node:assert/strict";
          import { readdir } from "node:fs/promises";
          import { inspectHeadlessRuntime } from "/payload/runtime-manifest.mjs";
          assert.deepEqual((await readdir("/payload")).sort(), ["LICENSE","SOURCE.json","THIRD_PARTY_LICENSES.txt","member-gateway.mjs","runtime-manifest.mjs","sdk","start.mjs","workbench"].sort());
          assert.equal((await inspectHeadlessRuntime("/payload")).source.product.commit, process.env.SOURCE_SHA);'
          docker build --platform linux/amd64 -f distribution/server/container/Dockerfile -t "zhuma-backend:$SOURCE_SHA" .build/qualification/payload
          test "$(docker image inspect "zhuma-backend:$SOURCE_SHA" --format '{{.Config.User}}')" = 10001:10001
      - name: Check real HTTP entry and member control-plane isolation
        run: |
          docker volume create zhuma-test-data
          docker run -d --name zhuma-http --read-only --cpus 1 --memory 1g --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount type=volume,source=zhuma-test-data,target=/data -p 127.0.0.1:3080:3080 --entrypoint /bin/sh "zhuma-backend:$SOURCE_SHA" -ec 'exec node /app/start.mjs --data /data --host "$(hostname -i)" --port 3080 --operator-port 3081 --public-origin http://127.0.0.1:3080 --file-uploads --independent-reviews'
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3080/workbench > .build/qualification/member.html; then break; fi
            test "$(docker inspect zhuma-http --format '{{.State.Running}}')" = true
            sleep 2
          done
          grep -Fq zhuma-member-root .build/qualification/member.html
          test "$(curl --connect-timeout 2 --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/workbench/app.js)" = 200
          for path in / /connect; do test "$(curl --connect-timeout 2 --max-time 5 -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3080$path")" = 404; done
          test "$(curl --connect-timeout 2 --max-time 5 -sS -X POST -H 'Origin: http://127.0.0.1:3080' -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/api/session/prompt)" = 404
          test "$(curl --connect-timeout 2 --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/zhuma-id/session)" = 401
          test "$(curl --connect-timeout 2 --max-time 5 -sS -X POST -H 'Origin: http://127.0.0.1:3080' -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/api/zhuma-member/snapshot)" = 401
          test "$(curl --connect-timeout 2 --max-time 5 -sS -H 'Host: attacker.invalid' -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/workbench)" = 403
          test "$(curl --connect-timeout 2 --max-time 5 -sS -H 'Origin: https://attacker.invalid' -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/workbench)" = 403
          test "$(docker inspect zhuma-http --format '{{.State.Running}}')" = true
          stopping_at=$(date +%s)
          docker stop --time 45 zhuma-http
          test "$(( $(date +%s) - stopping_at ))" -lt 30
          test "$(docker inspect zhuma-http --format '{{.State.OOMKilled}}')" = false
          exit_code=$(docker inspect zhuma-http --format '{{.State.ExitCode}}')
          test "$exit_code" = 0 || test "$exit_code" = 1
          printf '{"exitCode":%s,"scope":"idle process stop; no business Run drain proof"}\n' "$exit_code" > .build/qualification/artifacts/STOP.json
      - name: Export only qualified production bytes and their hashes
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$(git ls-remote --exit-code https://github.com/dolibali/zhuma.git refs/heads/main | cut -f1)" = "$SOURCE_SHA" || exit 1
          fi
          tar -C .build/qualification/payload -czf .build/qualification/artifacts/portable.tar.gz .
          docker save "zhuma-backend:$SOURCE_SHA" -o .build/qualification/artifacts/backend-image.tar
          cp .build/qualification/payload/SOURCE.json .build/qualification/artifacts/SOURCE.json
          docker image inspect "zhuma-backend:$SOURCE_SHA" --format '{{.Id}}' > .build/qualification/artifacts/IMAGE_ID
          cd .build/qualification/artifacts
          sha256sum portable.tar.gz backend-image.tar SOURCE.json IMAGE_ID STOP.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-server-amd64-${{ needs.mode.outputs.source }}
          path: .build/qualification/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Record bounded failed-start diagnostics from fresh test data only
        if: failure()
        run: |
          if docker inspect zhuma-http --format '{{json .State}}' 2>/dev/null; then
            docker logs --tail 80 zhuma-http 2>&1 | sed -E 's/token=[^[:space:]&]+/token=[redacted]/g'
          fi
      - name: Dispose only this runner's containers and fresh test data
        if: always()
        run: |
          docker rm -f zhuma-http zhuma-build 2>/dev/null || true
          docker volume rm zhuma-test-data zhuma-source 2>/dev/null || true
