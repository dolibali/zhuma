name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main SHA already accepted in the real Host debug window
        required: true
        type: string
      mode:
        description: Save artifacts only, or publish the same build after real Host acceptance
        required: true
        type: choice
        default: build-artifact
        options: [build-artifact, publish]

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  build:
    # Standard M1 arm64 runner; do not substitute the Intel -intel label.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Bind dispatch to the accepted full main SHA
        env:
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$DISPATCH_REF" = refs/heads/main
          test "$DISPATCH_SHA" = "$RELEASE_SOURCE_SHA"
          test "$(uname -m)" = arm64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Reuse exact-main CI and reject version or release conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop/release.mjs preflight
      - name: Install locked product dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare the pinned official desktop
        run: pnpm desktop:prepare
      - name: Build macOS arm64 ad-hoc DMG with the original recipe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DSH_DESKTOP_OPEN_DEVTOOLS: '0'
        run: |
          test "$(node -p process.arch)" = arm64
          pnpm desktop:package:mac
      - name: Verify this build and record source/checksums
        run: |
          pnpm desktop:verify:mac
          hdiutil verify "dist/zhuma-$(node -p "require('./package.json').version")-mac-arm64-unsigned.dmg"
          node scripts/desktop/release.mjs manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-arm64-${{ inputs.source_sha }}
          path: |
            dist/*.dmg
            dist/SOURCE.json
            dist/SHA256SUMS
            dist/packaged-backend.sh
            dist/packaged-backend.mjs
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: inputs.mode == 'publish'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-macos-arm64-${{ inputs.source_sha }}
          path: .build/release-input
      - name: Recheck identity/conflicts, upload new assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop/release.mjs publish
