name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install first-party workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check source pin and environment
        run: pnpm run doctor
      - name: Check first-party scaffold
        run: pnpm check
      - name: Build workbench Host and Client bundles
        run: pnpm workbench:build
      - name: Check composed Host artifact (real services, private test files, no models)
        run: pnpm test:host:run
      - name: Install Chromium for browser contracts
        run: pnpm exec playwright install --with-deps chromium
      - name: Check workbench browser contracts (fixture RPC, no models)
        run: pnpm test:ui:run
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-browser-failure
          path: |
            playwright-report/
            test-results/workbench/
          retention-days: 7
          if-no-files-found: ignore
      - name: Confirm clean upstream source
        run: pnpm upstream:check
